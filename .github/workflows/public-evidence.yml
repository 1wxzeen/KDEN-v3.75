name: Public evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect bundled evidence
        run: python -B examples/quickstart.py
      - name: Check figure inputs
        run: python -B -m unittest discover -s publication/figures -p 'test_*.py'
      - name: Check package integrity and local links
        run: python -B tools/check_publication.py
