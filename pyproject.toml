[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kden-v375"
version = "0.1.0"
description = "Independent HRRRv4 acquisition foundation for KDEN v3.75"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "requests==2.32.5",
  "numpy==2.0.2",
  "pyarrow==23.0.0",
  "eccodes==2.45.0",
]

[project.scripts]
kden-v375 = "kden_v375.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kden_v375*"]
exclude = ["kden_panel*", "kden35*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

